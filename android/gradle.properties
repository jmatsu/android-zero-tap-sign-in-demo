org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# The hostname the backend is reachable at. It must be an HTTPS host that serves
# /.well-known/assetlinks.json, because Credential Manager validates the app
# against the Relying Party before it will create passkeys or Restore Keys.
# Override on the command line, e.g.
#   ./gradlew installDebug -Pzerotap.rpId=abc123.ngrok-free.app
zerotap.rpId=localhost

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
